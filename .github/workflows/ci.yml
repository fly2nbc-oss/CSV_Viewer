name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub packt Workflow-Artefakte pro Upload als ZIP; die enthaltene Datei folgt
# den Tauri-/Release-Namen (`CSV Viewer_<Version>_…`, Setup/MSI, AppImage, …).
# Direkte Asset-Links ohne ZIP: GitHub Releases unter einem Versions-Tag (v*).

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            platform: ubuntu-22.04
            bundles: "deb,appimage"
          - id: windows
            platform: windows-latest
            bundles: "nsis,msi"
          - id: macos
            platform: macos-latest
            bundles: dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AppImage / linuxdeploy (strip workaround)
        if: matrix.id == 'linux'
        run: echo "NO_STRIP=true" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload Linux — .deb
        if: matrix.id == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer_${{ matrix.id }}_amd64.deb
          path: src-tauri/target/release/bundle/deb/*.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux — AppImage
        if: matrix.id == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer_${{ matrix.id }}_amd64.AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux — portable binary (csv-viewer)
        if: matrix.id == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer_portable_linux
          path: src-tauri/target/release/csv-viewer
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows — NSIS (x64-setup.exe)
        if: matrix.id == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer_windows_x64-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows — MSI
        if: matrix.id == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer_windows_x64_en-US.msi
          path: src-tauri/target/release/bundle/msi/*.msi
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows — portable binary (csv-viewer.exe)
        if: matrix.id == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer_portable_windows.exe
          path: src-tauri/target/release/csv-viewer.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS — .dmg
        if: matrix.id == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: csv-viewer_macos.dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

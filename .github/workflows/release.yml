name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - id: windows
            platform: windows-latest
            args: '--bundles nsis,msi'
          - id: macos
            platform: macos-latest
            args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AppImage / linuxdeploy (strip workaround)
        if: matrix.id == 'linux'
        run: echo "NO_STRIP=true" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CSV Viewer ${{ github.ref_name }}"
          releaseBody: |
            **Assets (download individually):**

            | Type | Example |
            |-----|----------|
            | Portable binary (Linux) | `csv-viewer` |
            | Portable binary (Windows) | `csv-viewer.exe` |
            | Linux `.deb` | `CSV Viewer_<Version>_amd64.deb` |
            | Linux AppImage | `CSV Viewer_<Version>_amd64.AppImage` |
            | Windows setup (NSIS) | `CSV Viewer_<Version>_x64-setup.exe` |
            | Windows MSI (WiX) | `CSV Viewer_<Version>_x64_en-US.msi` |
            | macOS | `.dmg` |

            **Note:** Versions in `src-tauri/tauri.conf.json` and Cargo should match the Git tag.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

      - name: Upload portable binary as csv-viewer (Linux)
        if: matrix.id == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/csv_viewer csv-viewer
          chmod +x csv-viewer
          gh release upload "${{ github.ref_name }}" csv-viewer --clobber --repo "${{ github.repository }}"

      - name: Upload portable binary as csv-viewer.exe (Windows)
        if: matrix.id == 'windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/csv_viewer.exe" -Destination "csv-viewer.exe"
          gh release upload "${{ github.ref_name }}" "csv-viewer.exe" --clobber --repo "${{ github.repository }}"

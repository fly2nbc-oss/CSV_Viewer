name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            platform: ubuntu-22.04
            args: "--bundles deb"
          - id: windows
            platform: windows-latest
            args: "--bundles nsis"
          - id: macos
            platform: macos-latest
            args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CSV Viewer ${{ github.ref_name }}"
          releaseBody: |
            Installierbare Builds für Windows (NSIS), Linux (.deb), macOS (.dmg).

            **Arch Linux / Manjaro:** Paket über `packaging/manjaro/` bauen (`makepkg -si`), siehe README.

            **Hinweis:** Die Versionsnummer in `src-tauri/tauri.conf.json` sollte mit diesem Tag übereinstimmen.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

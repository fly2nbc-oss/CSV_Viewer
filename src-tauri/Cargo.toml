[package]
name = "csv_viewer"
version = "1.0.0"
description = "Slim CSV viewer with XLSX export"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "csv_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
csv = "1"
umya-spreadsheet = "2"
encoding_rs = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# "z" minimiert die Binary-Größe stärker als "s" (Tauri/WebView bleibt der Hauptanteil).
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

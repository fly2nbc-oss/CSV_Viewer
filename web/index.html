<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="toolbar-group">
        <button id="openBtn" class="button button-primary">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3.75 18.25V7.75A1.75 1.75 0 0 1 5.5 6h4.1l1.6 2h7.3a1.75 1.75 0 0 1 1.75 1.75v8.5A1.75 1.75 0 0 1 18.5 20H5.5a1.75 1.75 0 0 1-1.75-1.75Z" />
              <path d="M3.75 10.25h16.5" />
            </svg>
          </span>
          <span>Open</span>
        </button>

        <button id="exportBtn" class="button button-secondary" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 3.75h7.25L19 8.5v11.75A1.75 1.75 0 0 1 17.25 22H7A1.75 1.75 0 0 1 5.25 20.25V5.5A1.75 1.75 0 0 1 7 3.75Z" />
              <path d="M14.25 3.75V8.5H19" />
              <path d="M12 11v6" />
              <path d="m9.5 14.5 2.5 2.5 2.5-2.5" />
            </svg>
          </span>
          <span>Export XLSX</span>
        </button>

        <button id="copyBtn" class="button button-secondary" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="8" y="6.25" width="11" height="13" rx="1.75" />
              <path d="M15.25 6.25V5.5A1.75 1.75 0 0 0 13.5 3.75h-7A1.75 1.75 0 0 0 4.75 5.5v10A1.75 1.75 0 0 0 6.5 17.25H8" />
            </svg>
          </span>
          <span>Copy Table</span>
        </button>
      </div>

      <div class="toolbar-group toolbar-grow">
        <label class="field field-search field--inline">
          <span class="field-label">Search</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Search text or e.g. Price &gt; 10, ColumnName &lt;= 5"
          />
        </label>

        <label class="field field-row field--inline">
          <span class="field-label">Row</span>
          <div class="field-inline">
            <input id="rowInput" type="number" min="1" step="1" placeholder="Jump to row" />
            <button id="jumpBtn" class="button button-secondary button-compact">
              <span class="btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h11" />
                  <path d="m12.5 7.5 4.5 4.5-4.5 4.5" />
                </svg>
              </span>
              <span>Go</span>
            </button>
          </div>
        </label>
      </div>

      <div class="toolbar-end">
        <button
          type="button"
          id="themeToggle"
          class="icon-btn"
          title="Toggle theme"
          aria-label="Switch between light and dark theme"
        >
          <span class="icon" id="themeIconSun" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
            </svg>
          </span>
          <span class="icon icon-hidden" id="themeIconMoon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </span>
        </button>

        <button type="button" id="aboutBtn" class="button button-secondary button-compact">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            </svg>
          </span>
          <span>About</span>
        </button>
      </div>
    </header>

    <section class="meta-bar">
      <div class="meta-group">
        <span id="rowCount" class="meta-item">0 rows</span>
        <span id="columnCount" class="meta-item">0 columns</span>
        <span id="delimiterInfo" class="meta-item">Delimiter: -</span>
        <span id="viewInfo" class="meta-item">Rows 0-0</span>
        <span id="sheetSelectorContainer" class="meta-item" hidden>
          <select id="sheetSelector" class="sheet-select" aria-label="Select worksheet"></select>
        </span>
        <span id="statsBar" class="meta-stats" hidden>
          <span class="meta-item meta-stats-name" id="statsName"></span>
          <span class="meta-item" id="statsSum"></span>
          <span class="meta-item" id="statsMin"></span>
          <span class="meta-item" id="statsMax"></span>
          <span class="meta-item" id="statsAvg"></span>
        </span>
      </div>
      <span id="fileInfo" class="meta-file">No file loaded</span>
    </section>

    <section class="table-panel">
      <section id="tableWrap" class="table-wrap">
        <div class="empty-state">
          <span class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
              <path d="M14 2v4h4M10 9h8M10 13h8M10 17h4" />
            </svg>
          </span>
          <p class="empty-title">No dataset loaded</p>
          <p class="empty-copy">Load a CSV, TXT or XLSX via button or drag and drop.</p>
        </div>
      </section>
    </section>
  </main>

  <div class="modal" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
    <div class="modal-backdrop" data-close-modal tabindex="-1" aria-hidden="true"></div>
    <div class="modal-card" role="document">
      <header class="modal-head">
        <h2 class="modal-title" id="aboutTitle">About CSV Viewer</h2>
        <button type="button" class="icon-btn modal-close-btn" data-close-modal aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </header>
      <div class="modal-body">
        <p class="modal-version">
          Version <strong id="aboutModalVersion">1.0.2</strong>
        </p>
        <p>Open and browse CSV/TXT files; export to XLSX.</p>
        <p>License: Apache-2.0</p>
        <p>
          <a href="https://github.com/fly2nbc-oss/CSV_Viewer" target="_blank" rel="noopener noreferrer"
            >github.com/fly2nbc-oss/CSV_Viewer</a>
        </p>
      </div>
      <footer class="modal-foot">
        <button type="button" class="button button-primary" id="aboutOkBtn" data-close-modal>OK</button>
      </footer>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
